<!-- Pizzeria e trattoria con animazioni -->
<div class="container-fluid overflow-hidden">
  <!-- PIZZERIA -->
  <div class="row my-5 mx-3">
    <h2
      class="section-title position-relative text-center mb-5 norwester w-100"
    >
      Bellella - Pizzeria Napoletana
    </h2>

    <div class="desc-home row align-items-center text-center text-md-start">
      <div class="col-12 col-md-4 mb-3 mb-md-0">
        <img
          class="img-fluid rounded-circle animate-from-left"
          src="assets/img/pizzeria/card2.jpeg"
        />
      </div>

      <div class="col-12 col-md-4">
        <p class="px-3 animate-from-bottom">
          {{ descrizionePizzeria }}
        </p>
      </div>

      <div class="col-12 col-md-4 mt-3 mt-md-0">
        <img
          class="img-fluid rounded-circle animate-from-right"
          src="assets/img/pizzeria/card2.jpeg"
        />
      </div>
    </div>
  </div>

  <!-- TRATTORIA -->
  <div class="row my-5 mx-3">
    <h2
      class="section-title position-relative text-center mb-5 norwester w-100"
    >
      Bellella - Trattoria Napoletana
    </h2>

    <div class="desc-home row align-items-center text-center text-md-start">
      <div class="col-12 col-md-6 order-2 order-md-1">
        <p class="px-3 animate-from-left">
          {{ descrizionePizzeria }}
        </p>
      </div>

      <div class="col-12 col-md-6 order-1 order-md-2 mb-3 mb-md-0">
        <img
          class="img-fluid animate-from-right"
          src="assets/img/trattoria/foto2.jpg"
        />
      </div>
    </div>
  </div>
</div>

<!-- Pizzeria e trattoria con animazioni -->

<!-- Feedback -->
<div class="container-fluid mb-3">
  <div class="row">
    <div class="col-lg-12">
      <h2 class="section-title position-relative text-center mb-5 norwester">
        Cosa dicono di noi
      </h2>
    </div>
    <div class="col-lg-4" *ngFor="let feedback of [1, 2, 3]">
      <div class="card">
        <div class="card-body text-center">
          <img
            src="https://randomuser.me/api/portraits/men/3.jpg"
            class="rounded-circle mb-3"
            alt="Client Avatar"
          />
          <h5 class="card-title">John Doe</h5>
          <p class="card-text text-muted">CEO, Company Inc.</p>
          <p class="card-text">
            "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis sed
            dapibus leo nec ornare diam."
          </p>
          <div class="text-warning">
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-half"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Feedback End -->
